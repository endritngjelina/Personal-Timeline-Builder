<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Timeline Builder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .header h1 {
            font-size: 2.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
            margin-bottom: 10px;
        }

        .header p {
            text-align: center;
            color: #666;
            font-size: 1.1rem;
        }

        .controls {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .control-group {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            margin-bottom: 15px;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }

        .btn.secondary {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .btn.success {
            background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
        }

        .btn.export {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            color: #333;
        }

        .input-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .input-group input, .input-group select, .input-group textarea {
            padding: 10px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-group input:focus, .input-group select:focus, .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .timeline-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            min-height: 600px;
        }

        .timeline {
            position: relative;
            padding: 20px 0;
        }

        .timeline::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #667eea, #764ba2);
            border-radius: 2px;
            transform: translateX(-50%);
        }

        .timeline-item {
            position: relative;
            margin: 30px 0;
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 2px solid #f0f4f8;
            transition: all 0.3s ease;
            cursor: move;
            width: 45%;
        }

        .timeline-item:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
            border-color: #667eea;
        }

        .timeline-item.left {
            left: 0;
        }

        .timeline-item.right {
            left: 55%;
        }

        .timeline-item::before {
            content: '';
            position: absolute;
            top: 30px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            box-shadow: 0 0 0 4px white, 0 0 0 8px #667eea;
            z-index: 10;
        }

        .timeline-item.left::before {
            right: -50px;
        }

        .timeline-item.right::before {
            left: -50px;
        }

        .timeline-item.milestone {
            border: 3px solid #ffd700;
            background: linear-gradient(135deg, #fff9c4 0%, #fff8dc 100%);
        }

        .timeline-item.milestone::before {
            background: #ffd700;
            box-shadow: 0 0 0 4px white, 0 0 0 8px #ffd700;
        }

        .event-header {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
        }

        .event-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            font-size: 18px;
        }

        .event-date {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 5px;
        }

        .event-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .event-description {
            color: #666;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .event-category {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            border-radius: 15px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .event-photo {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 10px;
            margin: 10px 0;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .event-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 15px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 500px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .modal h2 {
            margin-bottom: 20px;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #2c3e50;
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 28px;
            font-weight: bold;
            color: #999;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #333;
        }

        .drag-over {
            background: rgba(102, 126, 234, 0.1) !important;
            border-color: #667eea !important;
        }

        .search-filter {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 200px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .empty-state h3 {
            margin-bottom: 15px;
            font-size: 1.5rem;
        }

        .zoom-controls {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            z-index: 100;
        }

        .zoom-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            transition: all 0.3s ease;
        }

        .zoom-btn:hover {
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .timeline::before {
                left: 30px;
            }
            
            .timeline-item {
                width: calc(100% - 80px);
                left: 80px !important;
            }
            
            .timeline-item::before {
                left: -50px !important;
            }
            
            .control-group {
                flex-direction: column;
                align-items: stretch;
            }
            
            .input-group {
                flex-direction: column;
            }
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .pulse {
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(102, 126, 234, 0); }
            100% { box-shadow: 0 0 0 0 rgba(102, 126, 234, 0); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Personal Timeline Builder</h1>
            <p>Create, organize, and visualize your life's journey with interactive timelines</p>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-number" id="totalEvents">0</div>
                <div class="stat-label">Total Events</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalMilestones">0</div>
                <div class="stat-label">Milestones</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalCategories">0</div>
                <div class="stat-label">Categories</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="timeSpan">0</div>
                <div class="stat-label">Years Covered</div>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <button class="btn" onclick="showAddEventModal()">➕ Add Event</button>
                <button class="btn secondary" onclick="showImportModal()">📁 Import Data</button>
                <button class="btn export" onclick="exportTimeline()">💾 Export Timeline</button>
                <button class="btn success" onclick="autoArrange()">🔄 Auto Arrange</button>
            </div>
            
            <div class="search-filter">
                <input type="text" class="search-input" id="searchInput" placeholder="🔍 Search events..." onkeyup="filterEvents()">
                <select id="categoryFilter" onchange="filterEvents()">
                    <option value="">All Categories</option>
                </select>
                <select id="yearFilter" onchange="filterEvents()">
                    <option value="">All Years</option>
                </select>
                <button class="btn btn-small" onclick="clearFilters()">Clear Filters</button>
            </div>
        </div>

        <div class="timeline-container">
            <div class="timeline" id="timeline">
                <div class="empty-state" id="emptyState">
                    <h3>📅 Your Timeline Awaits</h3>
                    <p>Start building your personal timeline by adding your first event!</p>
                    <br>
                    <button class="btn" onclick="showAddEventModal()">Add Your First Event</button>
                </div>
            </div>
        </div>
    </div>

    <div class="zoom-controls">
        <button class="zoom-btn" onclick="zoomIn()" title="Zoom In">+</button>
        <button class="zoom-btn" onclick="zoomOut()" title="Zoom Out">-</button>
        <button class="zoom-btn" onclick="resetZoom()" title="Reset Zoom">⌂</button>
    </div>

    <!-- Add Event Modal -->
    <div id="eventModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <h2 id="modalTitle">Add New Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventTitle">Title *</label>
                    <input type="text" id="eventTitle" required>
                </div>
                <div class="form-group">
                    <label for="eventDate">Date *</label>
                    <input type="date" id="eventDate" required>
                </div>
                <div class="form-group">
                    <label for="eventCategory">Category</label>
                    <select id="eventCategory">
                        <option value="personal">Personal</option>
                        <option value="career">Career</option>
                        <option value="education">Education</option>
                        <option value="travel">Travel</option>
                        <option value="achievement">Achievement</option>
                        <option value="milestone">Milestone</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" placeholder="Tell the story of this moment..."></textarea>
                </div>
                <div class="form-group">
                    <label for="eventIcon">Icon</label>
                    <select id="eventIcon">
                        <option value="🎉">🎉 Celebration</option>
                        <option value="🎓">🎓 Education</option>
                        <option value="💼">💼 Career</option>
                        <option value="✈️">✈️ Travel</option>
                        <option value="🏆">🏆 Achievement</option>
                        <option value="💕">💕 Love</option>
                        <option value="🏠">🏠 Home</option>
                        <option value="🌟">🌟 Milestone</option>
                        <option value="📚">📚 Learning</option>
                        <option value="🎨">🎨 Creative</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="eventPhoto">Photo</label>
                    <input type="file" id="eventPhoto" accept="image/*">
                </div>
                <div class="form-group">
                    <label>
                        <input type="checkbox" id="isMilestone"> Mark as Major Milestone
                    </label>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn">Save Event</button>
                    <button type="button" class="btn secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Import Modal -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeImportModal()">&times;</span>
            <h2>Import Timeline Data</h2>
            <div class="form-group">
                <label for="importFile">Select JSON file</label>
                <input type="file" id="importFile" accept=".json">
                <button class="btn" onclick="importData()">Import</button>
            </div>
            <hr style="margin: 20px 0;">
            <div class="form-group">
                <label>Or paste JSON data:</label>
                <textarea id="importText" rows="10" placeholder="Paste your timeline JSON data here..."></textarea>
                <button class="btn" onclick="importFromText()">Import from Text</button>
            </div>
        </div>
    </div>

    <script>
        let events = [];
        let editingIndex = -1;
        let draggedElement = null;
        let currentZoom = 1;
        let nextId = 1;

        // Initialize the application
        document.addEventListener('DOMContentLoaded', function() {
            loadFromStorage();
            updateStats();
            populateFilters();
            renderTimeline();
        });

        function showAddEventModal() {
            document.getElementById('modalTitle').textContent = 'Add New Event';
            document.getElementById('eventForm').reset();
            document.getElementById('eventModal').style.display = 'block';
            editingIndex = -1;
        }

        function editEvent(index) {
            const event = events[index];
            document.getElementById('modalTitle').textContent = 'Edit Event';
            document.getElementById('eventTitle').value = event.title;
            document.getElementById('eventDate').value = event.date;
            document.getElementById('eventCategory').value = event.category;
            document.getElementById('eventDescription').value = event.description;
            document.getElementById('eventIcon').value = event.icon;
            document.getElementById('isMilestone').checked = event.milestone;
            document.getElementById('eventModal').style.display = 'block';
            editingIndex = index;
        }

        function closeModal() {
            document.getElementById('eventModal').style.display = 'none';
            editingIndex = -1;
        }

        function showImportModal() {
            document.getElementById('importModal').style.display = 'block';
        }

        function closeImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }

        document.getElementById('eventForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const eventData = {
                id: editingIndex >= 0 ? events[editingIndex].id : nextId++,
                title: document.getElementById('eventTitle').value,
                date: document.getElementById('eventDate').value,
                category: document.getElementById('eventCategory').value,
                description: document.getElementById('eventDescription').value,
                icon: document.getElementById('eventIcon').value,
                milestone: document.getElementById('isMilestone').checked,
                photo: null
            };

            // Handle photo upload
            const photoFile = document.getElementById('eventPhoto').files[0];
            if (photoFile) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    eventData.photo = e.target.result;
                    saveEvent(eventData);
                };
                reader.readAsDataURL(photoFile);
            } else {
                if (editingIndex >= 0 && events[editingIndex].photo) {
                    eventData.photo = events[editingIndex].photo;
                }
                saveEvent(eventData);
            }
        });

        function saveEvent(eventData) {
            if (editingIndex >= 0) {
                events[editingIndex] = eventData;
            } else {
                events.push(eventData);
            }
            
            saveToStorage();
            updateStats();
            populateFilters();
            renderTimeline();
            closeModal();
            
            showNotification('Event saved successfully!');
        }

        function deleteEvent(index) {
            if (confirm('Are you sure you want to delete this event?')) {
                events.splice(index, 1);
                saveToStorage();
                updateStats();
                populateFilters();
                renderTimeline();
                showNotification('Event deleted successfully!');
            }
        }

        function renderTimeline() {
            const timeline = document.getElementById('timeline');
            const emptyState = document.getElementById('emptyState');
            
            if (events.length === 0) {
                emptyState.style.display = 'block';
                return;
            }
            
            emptyState.style.display = 'none';
            
            // Sort events by date
            const sortedEvents = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
            
            // Clear existing events
            const existingItems = timeline.querySelectorAll('.timeline-item');
            existingItems.forEach(item => item.remove());
            
            sortedEvents.forEach((event, index) => {
                const eventElement = createEventElement(event, events.indexOf(event));
                eventElement.classList.add('fade-in');
                timeline.appendChild(eventElement);
                
                // Alternate left/right positioning
                if (window.innerWidth > 768) {
                    eventElement.classList.add(index % 2 === 0 ? 'left' : 'right');
                }
            });
        }

        function createEventElement(event, originalIndex) {
            const eventDiv = document.createElement('div');
            eventDiv.className = `timeline-item ${event.milestone ? 'milestone' : ''}`;
            eventDiv.draggable = true;
            eventDiv.dataset.index = originalIndex;
            
            const formatDate = new Date(event.date).toLocaleDateString('en-US', {
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            });
            
            eventDiv.innerHTML = `
                <div class="event-header">
                    <div class="event-icon">${event.icon}</div>
                    <div>
                        <div class="event-date">${formatDate}</div>
                        <div class="event-category">${event.category.toUpperCase()}</div>
                    </div>
                </div>
                <div class="event-title">${event.title}</div>
                <div class="event-description">${event.description}</div>
                ${event.photo ? `<img src="${event.photo}" alt="${event.title}" class="event-photo">` : ''}
                <div class="event-actions">
                    <button class="btn btn-small" onclick="editEvent(${originalIndex})">✏️ Edit</button>
                    <button class="btn btn-small secondary" onclick="deleteEvent(${originalIndex})">🗑️ Delete</button>
                    <button class="btn btn-small success" onclick="duplicateEvent(${originalIndex})">📋 Duplicate</button>
                </div>
            `;
            
            // Add drag and drop functionality
            eventDiv.addEventListener('dragstart', handleDragStart);
            eventDiv.addEventListener('dragover', handleDragOver);
            eventDiv.addEventListener('drop', handleDrop);
            eventDiv.addEventListener('dragend', handleDragEnd);
            
            return eventDiv;
        }

        function duplicateEvent(index) {
            const originalEvent = events[index];
            const duplicatedEvent = {
                ...originalEvent,
                id: nextId++,
                title: originalEvent.title + ' (Copy)',
                date: originalEvent.date
            };
            
            events.push(duplicatedEvent);
            saveToStorage();
            updateStats();
            populateFilters();
            renderTimeline();
            showNotification('Event duplicated successfully!');
        }

        // Drag and Drop functionality
        function handleDragStart(e) {
            draggedElement = this;
            this.style.opacity = '0.5';
        }

        function handleDragOver(e) {
            e.preventDefault();
            this.classList.add('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            this.classList.remove('drag-over');
            
            if (this !== draggedElement) {
                const draggedIndex = parseInt(draggedElement.dataset.index);
                const targetIndex = parseInt(this.dataset.index);
                
                // Swap events
                const temp = events[draggedIndex];
                events[draggedIndex] = events[targetIndex];
                events[targetIndex] = temp;
                
                saveToStorage();
                renderTimeline();
                showNotification('Events reordered successfully!');
            }
        }

        function handleDragEnd(e) {
            this.style.opacity = '1';
            this.classList.remove('drag-over');
            
            // Remove drag-over class from all items
            document.querySelectorAll('.timeline-item').forEach(item => {
                item.classList.remove('drag-over');
            });
        }

        function filterEvents() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const categoryFilter = document.getElementById('categoryFilter').value;
            const yearFilter = document.getElementById('yearFilter').value;
            
            const filteredEvents = events.filter(event => {
                const matchesSearch = event.title.toLowerCase().includes(searchTerm) || 
                                    event.description.toLowerCase().includes(searchTerm);
                const matchesCategory = !categoryFilter || event.category === categoryFilter;
                const matchesYear = !yearFilter || new Date(event.date).getFullYear().toString() === yearFilter;
                
                return matchesSearch && matchesCategory && matchesYear;
            });
            
            // Update display based on filtered events
            const timelineItems = document.querySelectorAll('.timeline-item');
            timelineItems.forEach((item, index) => {
                const eventIndex = parseInt(item.dataset.index);
                const event = events[eventIndex];
                
                if (filteredEvents.includes(event)) {
                    item.style.display = 'block';
                } else {
                    item.style.display = 'none';
                }
            });
        }

        function clearFilters() {
            document.getElementById('searchInput').value = '';
            document.getElementById('categoryFilter').value = '';
            document.getElementById('yearFilter').value = '';
            filterEvents();
        }

        function populateFilters() {
            const categoryFilter = document.getElementById('categoryFilter');
            const yearFilter = document.getElementById('yearFilter');
            
            // Clear existing options (except "All")
            categoryFilter.innerHTML = '<option value="">All Categories</option>';
            yearFilter.innerHTML = '<option value="">All Years</option>';
            
            // Get unique categories and years
            const categories = [...new Set(events.map(event => event.category))];
            const years = [...new Set(events.map(event => new Date(event.date).getFullYear()))].sort((a, b) => b - a);
            
            categories.forEach(category => {
                const option = document.createElement('option');
                option.value = category;
                option.textContent = category.charAt(0).toUpperCase() + category.slice(1);
                categoryFilter.appendChild(option);
            });
            
            years.forEach(year => {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                yearFilter.appendChild(option);
            });
        }

        function updateStats() {
            const totalEvents = events.length;
            const totalMilestones = events.filter(event => event.milestone).length;
            const totalCategories = new Set(events.map(event => event.category)).size;
            
            let timeSpan = 0;
            if (events.length > 1) {
                const dates = events.map(event => new Date(event.date));
                const minDate = new Date(Math.min(...dates));
                const maxDate = new Date(Math.max(...dates));
                timeSpan = Math.ceil((maxDate - minDate) / (1000 * 60 * 60 * 24 * 365.25));
            }
            
            document.getElementById('totalEvents').textContent = totalEvents;
            document.getElementById('totalMilestones').textContent = totalMilestones;
            document.getElementById('totalCategories').textContent = totalCategories;
            document.getElementById('timeSpan').textContent = timeSpan;
        }

        function autoArrange() {
            // Sort events by date
            events.sort((a, b) => new Date(a.date) - new Date(b.date));
            saveToStorage();
            renderTimeline();
            showNotification('Timeline auto-arranged by date!');
        }

        function exportTimeline() {
            const dataStr = JSON.stringify(events, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `timeline-${new Date().toISOString().split('T')[0]}.json`;
            link.click();
            URL.revokeObjectURL(url);
            showNotification('Timeline exported successfully!');
        }

        function importData() {
            const fileInput = document.getElementById('importFile');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select a file to import.');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const importedData = JSON.parse(e.target.result);
                    if (Array.isArray(importedData)) {
                        if (confirm('This will replace your current timeline. Continue?')) {
                            events = importedData;
                            nextId = Math.max(...events.map(e => e.id || 0)) + 1;
                            saveToStorage();
                            updateStats();
                            populateFilters();
                            renderTimeline();
                            closeImportModal();
                            showNotification('Timeline imported successfully!');
                        }
                    } else {
                        alert('Invalid file format. Please select a valid timeline JSON file.');
                    }
                } catch (error) {
                    alert('Error reading file: ' + error.message);
                }
            };
            reader.readAsText(file);
        }

        function importFromText() {
            const textData = document.getElementById('importText').value.trim();
            
            if (!textData) {
                alert('Please paste JSON data to import.');
                return;
            }
            
            try {
                const importedData = JSON.parse(textData);
                if (Array.isArray(importedData)) {
                    if (confirm('This will replace your current timeline. Continue?')) {
                        events = importedData;
                        nextId = Math.max(...events.map(e => e.id || 0)) + 1;
                        saveToStorage();
                        updateStats();
                        populateFilters();
                        renderTimeline();
                        closeImportModal();
                        showNotification('Timeline imported successfully!');
                    }
                } else {
                    alert('Invalid JSON format. Please paste a valid timeline array.');
                }
            } catch (error) {
                alert('Error parsing JSON: ' + error.message);
            }
        }

        // Zoom functionality
        function zoomIn() {
            currentZoom = Math.min(currentZoom + 0.2, 2);
            applyZoom();
        }

        function zoomOut() {
            currentZoom = Math.max(currentZoom - 0.2, 0.5);
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1;
            applyZoom();
        }

        function applyZoom() {
            const timeline = document.getElementById('timeline');
            timeline.style.transform = `scale(${currentZoom})`;
            timeline.style.transformOrigin = 'center top';
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Ctrl+N or Cmd+N for new event
            if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                e.preventDefault();
                showAddEventModal();
            }
            
            // Ctrl+S or Cmd+S for export
            if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                e.preventDefault();
                exportTimeline();
            }
            
            // Escape to close modals
            if (e.key === 'Escape') {
                closeModal();
                closeImportModal();
            }
        });

        // Notification system
        function showNotification(message) {
            const notification = document.createElement('div');
            notification.style.cssText = `
                position: fixed;
                top: 20px;
                right: 20px;
                background: linear-gradient(135deg, #4ecdc4 0%, #44a08d 100%);
                color: white;
                padding: 15px 25px;
                border-radius: 25px;
                font-weight: 600;
                box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
                z-index: 10000;
                animation: slideIn 0.3s ease-out;
            `;
            notification.textContent = message;
            
            const style = document.createElement('style');
            style.textContent = `
                @keyframes slideIn {
                    from { transform: translateX(100%); opacity: 0; }
                    to { transform: translateX(0); opacity: 1; }
                }
            `;
            document.head.appendChild(style);
            
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.style.animation = 'slideIn 0.3s ease-out reverse';
                setTimeout(() => {
                    document.body.removeChild(notification);
                    document.head.removeChild(style);
                }, 300);
            }, 3000);
        }

        // Local storage functions
        function saveToStorage() {
            try {
                localStorage.setItem('timelineEvents', JSON.stringify(events));
                localStorage.setItem('timelineNextId', nextId.toString());
            } catch (error) {
                console.log('Storage not available, using session data only');
            }
        }

        function loadFromStorage() {
            try {
                const savedEvents = localStorage.getItem('timelineEvents');
                const savedNextId = localStorage.getItem('timelineNextId');
                
                if (savedEvents) {
                    events = JSON.parse(savedEvents);
                }
                
                if (savedNextId) {
                    nextId = parseInt(savedNextId);
                }
            } catch (error) {
                console.log('Could not load from storage, starting fresh');
                events = [];
                nextId = 1;
            }
        }

        // Advanced features
        function generateTimelineReport() {
            const report = {
                totalEvents: events.length,
                totalMilestones: events.filter(e => e.milestone).length,
                categoriesBreakdown: {},
                yearlyBreakdown: {},
                timeSpan: 0
            };
            
            // Categories breakdown
            events.forEach(event => {
                report.categoriesBreakdown[event.category] = (report.categoriesBreakdown[event.category] || 0) + 1;
            });
            
            // Yearly breakdown
            events.forEach(event => {
                const year = new Date(event.date).getFullYear();
                report.yearlyBreakdown[year] = (report.yearlyBreakdown[year] || 0) + 1;
            });
            
            // Calculate time span
            if (events.length > 1) {
                const dates = events.map(event => new Date(event.date));
                const minDate = new Date(Math.min(...dates));
                const maxDate = new Date(Math.max(...dates));
                report.timeSpan = Math.ceil((maxDate - minDate) / (1000 * 60 * 60 * 24 * 365.25));
            }
            
            return report;
        }

        // Click outside modal to close
        window.onclick = function(event) {
            const eventModal = document.getElementById('eventModal');
            const importModal = document.getElementById('importModal');
            
            if (event.target === eventModal) {
                closeModal();
            }
            if (event.target === importModal) {
                closeImportModal();
            }
        };

        // Responsive design adjustments
        window.addEventListener('resize', function() {
            renderTimeline();
