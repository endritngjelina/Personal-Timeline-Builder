<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Timeline Builder</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary-color: #0078d4;
            --secondary-color: #106ebe;
            --accent-color: #40e0d0;
            --background: #f8f9fa;
            --surface: #ffffff;
            --text-primary: #323130;
            --text-secondary: #605e5c;
            --border: #e1dfdd;
            --success: #107c10;
            --warning: #ff8c00;
            --error: #d13438;
            --shadow: 0 2px 8px rgba(0,0,0,0.1);
            --shadow-lg: 0 8px 32px rgba(0,0,0,0.15);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--background) 0%, #e8f4f8 100%);
            color: var(--text-primary);
            line-height: 1.6;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--secondary-color) 100%);
            color: white;
            padding: 1.5rem 0;
            box-shadow: var(--shadow-lg);
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 100%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { transform: translateX(-100%) rotate(45deg); }
            100% { transform: translateX(100%) rotate(45deg); }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 2rem;
            position: relative;
            z-index: 1;
        }

        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .logo i {
            font-size: 2rem;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid rgba(255,255,255,0.3);
        }

        .btn-primary:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }

        .btn-secondary {
            background: var(--surface);
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
        }

        .btn-secondary:hover {
            background: var(--primary-color);
            color: white;
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .main-content {
            display: flex;
            min-height: calc(100vh - 120px);
            gap: 2rem;
            padding: 2rem 0;
        }

        .sidebar {
            width: 320px;
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            height: fit-content;
            position: sticky;
            top: 2rem;
        }

        .section-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .form-input, .form-select, .form-textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--surface);
        }

        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(0,120,212,0.1);
            transform: translateY(-1px);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .icon-selector {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 0.5rem;
            margin-top: 0.5rem;
        }

        .icon-option {
            padding: 0.75rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s ease;
            background: var(--surface);
        }

        .icon-option:hover {
            border-color: var(--primary-color);
            transform: scale(1.05);
        }

        .icon-option.selected {
            border-color: var(--primary-color);
            background: rgba(0,120,212,0.1);
            color: var(--primary-color);
        }

        .timeline-container {
            flex: 1;
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            position: relative;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .timeline-controls {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .view-toggle {
            display: flex;
            border: 2px solid var(--border);
            border-radius: 8px;
            overflow: hidden;
        }

        .view-btn {
            padding: 0.5rem 1rem;
            border: none;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .view-btn.active {
            background: var(--primary-color);
            color: white;
        }

        .timeline {
            position: relative;
            padding: 2rem 0;
        }

        .timeline-line {
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, var(--primary-color), var(--accent-color));
            transform: translateX(-50%);
            border-radius: 2px;
        }

        .timeline-item {
            position: relative;
            margin-bottom: 3rem;
            opacity: 0;
            animation: slideIn 0.6s ease forwards;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .timeline-item:nth-child(even) .timeline-content {
            margin-left: calc(50% + 2rem);
        }

        .timeline-item:nth-child(odd) .timeline-content {
            margin-right: calc(50% + 2rem);
        }

        .timeline-marker {
            position: absolute;
            left: 50%;
            top: 1rem;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary-color), var(--accent-color));
            border-radius: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.5rem;
            box-shadow: 0 4px 20px rgba(0,120,212,0.3);
            z-index: 2;
            cursor: move;
            transition: all 0.3s ease;
        }

        .timeline-marker:hover {
            transform: translateX(-50%) scale(1.1);
            box-shadow: 0 8px 30px rgba(0,120,212,0.4);
        }

        .timeline-content {
            background: var(--surface);
            border-radius: 12px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 2px solid var(--border);
            transition: all 0.3s ease;
            cursor: move;
            position: relative;
        }

        .timeline-content:hover {
            box-shadow: var(--shadow-lg);
            transform: translateY(-5px);
            border-color: var(--primary-color);
        }

        .timeline-content::before {
            content: '';
            position: absolute;
            top: 1.5rem;
            width: 0;
            height: 0;
            border: 12px solid transparent;
        }

        .timeline-item:nth-child(odd) .timeline-content::before {
            right: -24px;
            border-left-color: var(--border);
        }

        .timeline-item:nth-child(even) .timeline-content::before {
            left: -24px;
            border-right-color: var(--border);
        }

        .event-date {
            font-weight: 600;
            color: var(--primary-color);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .event-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 0.75rem;
            color: var(--text-primary);
        }

        .event-description {
            color: var(--text-secondary);
            margin-bottom: 1rem;
            line-height: 1.6;
        }

        .event-image {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 1rem;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .event-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .tag {
            padding: 0.25rem 0.75rem;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .event-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.8rem;
        }

        .btn-edit {
            background: var(--warning);
            color: white;
        }

        .btn-delete {
            background: var(--error);
            color: white;
        }

        .drop-zone {
            border: 3px dashed var(--border);
            border-radius: 12px;
            padding: 3rem 2rem;
            text-align: center;
            margin: 2rem 0;
            transition: all 0.3s ease;
            background: rgba(0,120,212,0.02);
        }

        .drop-zone.drag-over {
            border-color: var(--primary-color);
            background: rgba(0,120,212,0.1);
            transform: scale(1.02);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 4rem;
            color: var(--border);
            margin-bottom: 1rem;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }

        .file-input {
            opacity: 0;
            position: absolute;
            z-index: -1;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 2px dashed var(--border);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            justify-content: center;
        }

        .file-input-label:hover {
            border-color: var(--primary-color);
            background: rgba(0,120,212,0.05);
        }

        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 700;
            display: block;
        }

        .stat-label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .search-filter {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .search-input {
            flex: 1;
            min-width: 250px;
        }

        .filter-select {
            min-width: 150px;
        }

        .dragging {
            opacity: 0.5;
            transform: rotate(5deg);
        }

        .drag-placeholder {
            height: 4px;
            background: var(--primary-color);
            margin: 1rem 0;
            border-radius: 2px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .drag-placeholder.visible {
            opacity: 1;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 1rem;
            }

            .main-content {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                position: static;
            }

            .timeline-line {
                left: 2rem;
            }

            .timeline-marker {
                left: 2rem;
                width: 40px;
                height: 40px;
                font-size: 1rem;
            }

            .timeline-item:nth-child(odd) .timeline-content,
            .timeline-item:nth-child(even) .timeline-content {
                margin-left: 4rem;
                margin-right: 0;
            }

            .timeline-content::before {
                display: none;
            }

            .header-content {
                flex-direction: column;
                text-align: center;
            }
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--surface);
            border-radius: 12px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: var(--shadow-lg);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--border);
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.3s ease;
        }

        .close-modal:hover {
            background: var(--border);
            color: var(--text-primary);
        }

        .toast {
            position: fixed;
            top: 2rem;
            right: 2rem;
            background: var(--success);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: var(--shadow-lg);
            z-index: 1001;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .toast.show {
            transform: translateX(0);
        }

        .export-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .export-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem;
            border: 2px solid var(--border);
            border-radius: 8px;
            background: var(--surface);
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            color: var(--text-primary);
        }

        .export-btn:hover {
            border-color: var(--primary-color);
            background: rgba(0,120,212,0.05);
        }

        .export-btn i {
            font-size: 2rem;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header-content">
                <div class="logo">
                    <i class="fas fa-timeline"></i>
                    <span>Timeline Builder Pro</span>
                </div>
                <div class="header-actions">
                    <button class="btn btn-primary" onclick="exportTimeline()">
                        <i class="fas fa-download"></i>
                        Export
                    </button>
                    <button class="btn btn-primary" onclick="importTimeline()">
                        <i class="fas fa-upload"></i>
                        Import
                    </button>
                    <button class="btn btn-secondary" onclick="showHelp()">
                        <i class="fas fa-question-circle"></i>
                        Help
                    </button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-content">
            <aside class="sidebar">
                <div class="section-title">
                    <i class="fas fa-plus-circle"></i>
                    Add New Event
                </div>

                <form id="eventForm">
                    <div class="form-group">
                        <label class="form-label">Event Title *</label>
                        <input type="text" id="eventTitle" class="form-input" required placeholder="Enter event title">
                    </div>

                    <div class="form-group">
                        <label class="form-label">Date *</label>
                        <input type="date" id="eventDate" class="form-input" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Category</label>
                        <select id="eventCategory" class="form-select">
                            <option value="personal">Personal</option>
                            <option value="career">Career</option>
                            <option value="education">Education</option>
                            <option value="travel">Travel</option>
                            <option value="achievement">Achievement</option>
                            <option value="milestone">Milestone</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Description</label>
                        <textarea id="eventDescription" class="form-textarea" placeholder="Describe your event..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Icon</label>
                        <div class="icon-selector" id="iconSelector">
                            <div class="icon-option selected" data-icon="fas fa-star">
                                <i class="fas fa-star"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-graduation-cap">
                                <i class="fas fa-graduation-cap"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-briefcase">
                                <i class="fas fa-briefcase"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-plane">
                                <i class="fas fa-plane"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-heart">
                                <i class="fas fa-heart"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-home">
                                <i class="fas fa-home"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-trophy">
                                <i class="fas fa-trophy"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-camera">
                                <i class="fas fa-camera"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-music">
                                <i class="fas fa-music"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-book">
                                <i class="fas fa-book"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-car">
                                <i class="fas fa-car"></i>
                            </div>
                            <div class="icon-option" data-icon="fas fa-gift">
                                <i class="fas fa-gift"></i>
                            </div>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Photo</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="eventImage" class="file-input" accept="image/*">
                            <label for="eventImage" class="file-input-label">
                                <i class="fas fa-image"></i>
                                Choose Photo
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Tags (comma-separated)</label>
                        <input type="text" id="eventTags" class="form-input" placeholder="work, achievement, milestone">
                    </div>

                    <button type="submit" class="btn btn-secondary" style="width: 100%;">
                        <i class="fas fa-plus"></i>
                        Add Event
                    </button>
                </form>
            </aside>

            <main class="timeline-container">
                <div class="timeline-header">
                    <div>
                        <h2 class="section-title">
                            <i class="fas fa-timeline"></i>
                            My Personal Timeline
                        </h2>
                    </div>
                    <div class="timeline-controls">
                        <div class="search-filter">
                            <input type="text" id="searchInput" class="form-input search-input" placeholder="Search events...">
                            <select id="categoryFilter" class="form-select filter-select">
                                <option value="">All Categories</option>
                                <option value="personal">Personal</option>
                                <option value="career">Career</option>
                                <option value="education">Education</option>
                                <option value="travel">Travel</option>
                                <option value="achievement">Achievement</option>
                                <option value="milestone">Milestone</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="stats-panel">
                    <div class="stat-card">
                        <span class="stat-number" id="totalEvents">0</span>
                        <span class="stat-label">Total Events</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="thisYear">0</span>
                        <span class="stat-label">This Year</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="categories">0</span>
                        <span class="stat-label">Categories</span>
                    </div>
                </div>

                <div class="timeline" id="timeline">
                    <div class="timeline-line"></div>
                    <div class="empty-state" id="emptyState">
                        <i class="fas fa-timeline"></i>
                        <h3>No events yet</h3>
                        <p>Add your first event to start building your timeline</p>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Edit Event</h3>
                <button class="close-modal" onclick="closeModal('editModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="editForm">
                <!-- Same form fields as add form -->
                <div class="form-group">
                    <label class="form-label">Event Title *</label>
                    <input type="text" id="editTitle" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Date *</label>
                    <input type="date" id="editDate" class="form-input" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Category</label>
                    <select id="editCategory" class="form-select">
                        <option value="personal">Personal</option>
                        <option value="career">Career</option>
                        <option value="education">Education</option>
                        <option value="travel">Travel</option>
                        <option value="achievement">Achievement</option>
                        <option value="milestone">Milestone</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Description</label>
                    <textarea id="editDescription" class="form-textarea"></textarea>
                </div>
                <button type="submit" class="btn btn-secondary" style="width: 100%;">
                    <i class="fas fa-save"></i>
                    Save Changes
                </button>
            </form>
        </div>
    </div>

    <div class="modal" id="exportModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Export Timeline</h3>
                <button class="close-modal" onclick="closeModal('exportModal')">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="export-options">
                <div class="export-btn" onclick="exportJSON()">
                    <i class="fas fa-code"></i>
                    <span>JSON</span>
                </div>
                <div class="export-btn" onclick="exportPDF()">
                    <i class="fas fa-file-pdf"></i>
                    <span>PDF</span>
                </div>
                <div class="export-btn" onclick="exportImage()">
                    <i class="fas fa-image"></i>
                    <span>Image</span>
                </div>
                <div class="export-btn" onclick="exportCSV()">
                    <i class="fas fa-table"></i>
                    <span>CSV</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        class TimelineBuilder {
            constructor() {
                this.events = JSON.parse(localStorage.getItem('timelineEvents') || '[]');
                this.currentEditId = null;
                this.draggedElement = null;
                this.init();
            }

            init() {
                this.setupEventListeners();
                this.renderTimeline();
                this.updateStats();
                this.loadSampleData();
            }

            setupEventListeners() {
                // Form submissions
                document.getElementById('eventForm').addEventListener('submit', (e) => this.handleAddEvent(e));
                document.getElementById('editForm').addEventListener('submit', (e) => this.handleEditEvent(e));

                // Icon selection
                document.querySelectorAll('.icon-option').forEach(option => {
                    option.addEventListener('click', (e) => this.selectIcon(e));
                });

                // Search and filter
                document.getElementById('searchInput').addEventListener('input', () => this.filterEvents());
                document.getElementById('categoryFilter').addEventListener('change', () => this.filterEvents());

                // File input
                document.getElementById('eventImage').addEventListener('change', (e) => this.handleImageUpload(e));

                // Drag and drop for timeline reordering
                this.setupDragAndDrop();

                // Modal close on outside click
                document.querySelectorAll('.modal').forEach(modal => {
                    modal.addEventListener('click', (e) => {
                        if (e.target === modal) {
                            this.closeModal(modal.id);
                        }
                    });
                });

                // Keyboard shortcuts
                document.addEventListener('keydown', (e) => this.handleKeyboardShortcuts(e));
            }

            handleAddEvent(e) {
                e.preventDefault();
                
                const formData = new FormData(e.target);
                const selectedIcon = document.querySelector('.icon-option.selected');
                
                const event = {
                    id: Date.now().toString(),
                    title: document.getElementById('eventTitle').value,
                    date: document.getElementById('eventDate').value,
                    category: document.getElementById('eventCategory').value,
                    description: document.getElementById('eventDescription').value,
                    icon: selectedIcon.dataset.icon,
                    image: document.getElementById('eventImage').files[0] ? this.getImageDataUrl(document.getElementById('eventImage').files[0]) : null,
                    tags: document.getElementById('eventTags').value.split(',').map(tag => tag.trim()).filter(tag => tag),
                    created: new Date().toISOString()
                };

                // Handle image upload asynchronously
                if (document.getElementById('eventImage').files[0]) {
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        event.image = e.target.result;
                        this.addEventToTimeline(event);
                    };
                    reader.readAsDataURL(document.getElementById('eventImage').files[0]);
                } else {
                    this.addEventToTimeline(event);
                }
            }

            addEventToTimeline(event) {
                this.events.push(event);
                this.saveEvents();
                this.renderTimeline();
                this.updateStats();
                this.resetForm();
                this.showToast('Event added successfully!', 'success');
            }

            handleEditEvent(e) {
                e.preventDefault();
                
                const eventIndex = this.events.findIndex(event => event.id === this.currentEditId);
                if (eventIndex !== -1) {
                    this.events[eventIndex] = {
                        ...this.events[eventIndex],
                        title: document.getElementById('editTitle').value,
                        date: document.getElementById('editDate').value,
                        category: document.getElementById('editCategory').value,
                        description: document.getElementById('editDescription').value,
                        modified: new Date().toISOString()
                    };
                    
                    this.saveEvents();
                    this.renderTimeline();
                    this.updateStats();
                    this.closeModal('editModal');
                    this.showToast('Event updated successfully!', 'success');
                }
            }

            selectIcon(e) {
                document.querySelectorAll('.icon-option').forEach(option => {
                    option.classList.remove('selected');
                });
                e.currentTarget.classList.add('selected');
            }

            renderTimeline() {
                const timeline = document.getElementById('timeline');
                const emptyState = document.getElementById('emptyState');
                
                if (this.events.length === 0) {
                    emptyState.style.display = 'block';
                    timeline.querySelector('.timeline-line').style.display = 'none';
                    return;
                }

                emptyState.style.display = 'none';
                timeline.querySelector('.timeline-line').style.display = 'block';

                // Sort events by date
                const sortedEvents = [...this.events].sort((a, b) => new Date(a.date) - new Date(b.date));

                // Clear existing events (keep timeline line and empty state)
                const existingEvents = timeline.querySelectorAll('.timeline-item');
                existingEvents.forEach(item => item.remove());

                sortedEvents.forEach((event, index) => {
                    const eventElement = this.createEventElement(event, index);
                    timeline.appendChild(eventElement);
                    
                    // Add staggered animation
                    setTimeout(() => {
                        eventElement.style.animationDelay = `${index * 0.1}s`;
                    }, 10);
                });
            }

            createEventElement(event, index) {
                const eventDiv = document.createElement('div');
                eventDiv.className = 'timeline-item';
                eventDiv.draggable = true;
                eventDiv.dataset.eventId = event.id;

                const formattedDate = new Date(event.date).toLocaleDateString('en-US', {
                    year: 'numeric',
                    month: 'long',
                    day: 'numeric'
                });

                const tags = event.tags && event.tags.length > 0 ? 
                    event.tags.map(tag => `<span class="tag">${tag}</span>`).join('') : '';

                const imageHtml = event.image ? 
                    `<img src="${event.image}" alt="${event.title}" class="event-image">` : '';

                eventDiv.innerHTML = `
                    <div class="timeline-marker" data-event-id="${event.id}">
                        <i class="${event.icon}"></i>
                    </div>
                    <div class="timeline-content">
                        <div class="event-date">
                            <i class="fas fa-calendar"></i>
                            ${formattedDate}
                        </div>
                        <div class="event-title">${event.title}</div>
                        ${event.description ? `<div class="event-description">${event.description}</div>` : ''}
                        ${imageHtml}
                        ${tags ? `<div class="event-tags">${tags}</div>` : ''}
                        <div class="event-actions">
                            <button class="btn btn-small btn-edit" onclick="timelineApp.editEvent('${event.id}')">
                                <i class="fas fa-edit"></i>
                                Edit
                            </button>
                            <button class="btn btn-small btn-delete" onclick="timelineApp.deleteEvent('${event.id}')">
                                <i class="fas fa-trash"></i>
                                Delete
                            </button>
                        </div>
                    </div>
                `;

                return eventDiv;
            }

            editEvent(eventId) {
                const event = this.events.find(e => e.id === eventId);
                if (event) {
                    this.currentEditId = eventId;
                    
                    document.getElementById('editTitle').value = event.title;
                    document.getElementById('editDate').value = event.date;
                    document.getElementById('editCategory').value = event.category;
                    document.getElementById('editDescription').value = event.description || '';
                    
                    this.showModal('editModal');
                }
            }

            deleteEvent(eventId) {
                if (confirm('Are you sure you want to delete this event?')) {
                    this.events = this.events.filter(event => event.id !== eventId);
                    this.saveEvents();
                    this.renderTimeline();
                    this.updateStats();
                    this.showToast('Event deleted successfully!', 'success');
                }
            }

            filterEvents() {
                const searchTerm = document.getElementById('searchInput').value.toLowerCase();
                const categoryFilter = document.getElementById('categoryFilter').value;
                
                const filteredEvents = this.events.filter(event => {
                    const matchesSearch = event.title.toLowerCase().includes(searchTerm) ||
                                        (event.description && event.description.toLowerCase().includes(searchTerm)) ||
                                        (event.tags && event.tags.some(tag => tag.toLowerCase().includes(searchTerm)));
                    
                    const matchesCategory = !categoryFilter || event.category === categoryFilter;
                    
                    return matchesSearch && matchesCategory;
                });

                this.renderFilteredEvents(filteredEvents);
            }

            renderFilteredEvents(events) {
                const timeline = document.getElementById('timeline');
                const emptyState = document.getElementById('emptyState');
                
                if (events.length === 0) {
                    emptyState.style.display = 'block';
                    emptyState.innerHTML = `
                        <i class="fas fa-search"></i>
                        <h3>No events found</h3>
                        <p>Try adjusting your search criteria</p>
                    `;
                    timeline.querySelector('.timeline-line').style.display = 'none';
                    const existingEvents = timeline.querySelectorAll('.timeline-item');
                    existingEvents.forEach(item => item.remove());
                    return;
                }

                emptyState.style.display = 'none';
                timeline.querySelector('.timeline-line').style.display = 'block';

                const sortedEvents = [...events].sort((a, b) => new Date(a.date) - new Date(b.date));
                
                const existingEvents = timeline.querySelectorAll('.timeline-item');
                existingEvents.forEach(item => item.remove());

                sortedEvents.forEach((event, index) => {
                    const eventElement = this.createEventElement(event, index);
                    timeline.appendChild(eventElement);
                });
            }

            updateStats() {
                const totalEvents = this.events.length;
                const currentYear = new Date().getFullYear();
                const thisYearEvents = this.events.filter(event => 
                    new Date(event.date).getFullYear() === currentYear
                ).length;
                const uniqueCategories = [...new Set(this.events.map(event => event.category))].length;

                document.getElementById('totalEvents').textContent = totalEvents;
                document.getElementById('thisYear').textContent = thisYearEvents;
                document.getElementById('categories').textContent = uniqueCategories;
            }

            setupDragAndDrop() {
                const timeline = document.getElementById('timeline');
                
                timeline.addEventListener('dragstart', (e) => {
                    if (e.target.classList.contains('timeline-item')) {
                        this.draggedElement = e.target;
                        e.target.classList.add('dragging');
                        e.dataTransfer.effectAllowed = 'move';
                    }
                });

                timeline.addEventListener('dragend', (e) => {
                    if (e.target.classList.contains('timeline-item')) {
                        e.target.classList.remove('dragging');
                        this.draggedElement = null;
                        
                        // Remove all placeholders
                        document.querySelectorAll('.drag-placeholder').forEach(placeholder => {
                            placeholder.remove();
                        });
                    }
                });

                timeline.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (this.draggedElement) {
                        const afterElement = this.getDragAfterElement(timeline, e.clientY);
                        
                        // Remove existing placeholders
                        document.querySelectorAll('.drag-placeholder').forEach(placeholder => {
                            placeholder.remove();
                        });

                        // Add new placeholder
                        const placeholder = document.createElement('div');
                        placeholder.className = 'drag-placeholder visible';
                        
                        if (afterElement == null) {
                            timeline.appendChild(placeholder);
                        } else {
                            timeline.insertBefore(placeholder, afterElement);
                        }
                    }
                });

                timeline.addEventListener('drop', (e) => {
                    e.preventDefault();
                    if (this.draggedElement) {
                        const afterElement = this.getDragAfterElement(timeline, e.clientY);
                        const draggedId = this.draggedElement.dataset.eventId;
                        
                        // Reorder events array
                        this.reorderEvents(draggedId, afterElement);
                        
                        // Re-render timeline
                        this.renderTimeline();
                        this.showToast('Timeline reordered successfully!', 'success');
                    }
                });
            }

            getDragAfterElement(container, y) {
                const draggableElements = [...container.querySelectorAll('.timeline-item:not(.dragging)')];
                
                return draggableElements.reduce((closest, child) => {
                    const box = child.getBoundingClientRect();
                    const offset = y - box.top - box.height / 2;
                    
                    if (offset < 0 && offset > closest.offset) {
                        return { offset: offset, element: child };
                    } else {
                        return closest;
                    }
                }, { offset: Number.NEGATIVE_INFINITY }).element;
            }

            reorderEvents(draggedId, afterElement) {
                const draggedEvent = this.events.find(event => event.id === draggedId);
                const draggedIndex = this.events.findIndex(event => event.id === draggedId);
                
                // Remove dragged event from array
                this.events.splice(draggedIndex, 1);
                
                if (afterElement) {
                    const afterId = afterElement.dataset.eventId;
                    const afterIndex = this.events.findIndex(event => event.id === afterId);
                    this.events.splice(afterIndex, 0, draggedEvent);
                } else {
                    this.events.push(draggedEvent);
                }
                
                this.saveEvents();
            }

            handleKeyboardShortcuts(e) {
                // Ctrl/Cmd + S to save
                if ((e.ctrlKey || e.metaKey) && e.key === 's') {
                    e.preventDefault();
                    this.exportJSON();
                }
                
                // Escape to close modals
                if (e.key === 'Escape') {
                    document.querySelectorAll('.modal').forEach(modal => {
                        if (modal.style.display === 'block') {
                            this.closeModal(modal.id);
                        }
                    });
                }
                
                // Ctrl/Cmd + N to add new event
                if ((e.ctrlKey || e.metaKey) && e.key === 'n') {
                    e.preventDefault();
                    document.getElementById('eventTitle').focus();
                }
            }

            resetForm() {
                document.getElementById('eventForm').reset();
                document.querySelectorAll('.icon-option').forEach(option => {
                    option.classList.remove('selected');
                });
                document.querySelector('.icon-option').classList.add('selected');
            }

            saveEvents() {
                try {
                    localStorage.setItem('timelineEvents', JSON.stringify(this.events));
                } catch (error) {
                    console.warn('Could not save to localStorage:', error);
                    this.showToast('Warning: Changes may not persist', 'warning');
                }
            }

            loadSampleData() {
                if (this.events.length === 0) {
                    const sampleEvents = [
                        {
                            id: 'sample-1',
                            title: 'Started College',
                            date: '2020-09-01',
                            category: 'education',
                            description: 'Began my journey in Computer Science at the university.',
                            icon: 'fas fa-graduation-cap',
                            tags: ['education', 'milestone'],
                            created: new Date().toISOString()
                        },
                        {
                            id: 'sample-2',
                            title: 'First Internship',
                            date: '2022-06-15',
                            category: 'career',
                            description: 'Secured my first software development internship at a tech company.',
                            icon: 'fas fa-briefcase',
                            tags: ['career', 'achievement'],
                            created: new Date().toISOString()
                        },
                        {
                            id: 'sample-3',
                            title: 'Graduation Day',
                            date: '2024-05-20',
                            category: 'education',
                            description: 'Graduated with honors with a Bachelor\'s degree in Computer Science.',
                            icon: 'fas fa-trophy',
                            tags: ['education', 'achievement', 'milestone'],
                            created: new Date().toISOString()
                        }
                    ];
                    
                    this.events = sampleEvents;
                    this.saveEvents();
                    this.renderTimeline();
                    this.updateStats();
                }
            }

            showModal(modalId) {
                document.getElementById(modalId).style.display = 'block';
                document.body.style.overflow = 'hidden';
            }

            closeModal(modalId) {
                document.getElementById(modalId).style.display = 'none';
                document.body.style.overflow = 'auto';
            }

            showToast(message, type = 'success') {
                const existingToast = document.querySelector('.toast');
                if (existingToast) {
                    existingToast.remove();
                }

                const toast = document.createElement('div');
                toast.className = `toast ${type}`;
                toast.innerHTML = `
                    <i class="fas fa-${type === 'success' ? 'check-circle' : type === 'warning' ? 'exclamation-triangle' : 'info-circle'}"></i>
                    ${message}
                `;
                
                document.body.appendChild(toast);
                
                setTimeout(() => toast.classList.add('show'), 100);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            }

            exportJSON() {
                const dataStr = JSON.stringify(this.events, null, 2);
                const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
                
                const exportFileDefaultName = `timeline-${new Date().toISOString().split('T')[0]}.json`;
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', exportFileDefaultName);
                linkElement.click();
                
                this.showToast('Timeline exported as JSON!', 'success');
            }

            exportCSV() {
                const csvHeaders = ['Title', 'Date', 'Category', 'Description', 'Tags'];
                const csvRows = this.events.map(event => [
                    `"${event.title.replace(/"/g, '""')}"`,
                    event.date,
                    event.category,
                    `"${(event.description || '').replace(/"/g, '""')}"`,
                    `"${(event.tags || []).join(', ')}"`
                ]);
                
                const csvContent = [csvHeaders.join(','), ...csvRows.map(row => row.join(','))].join('\n');
                const dataUri = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csvContent);
                
                const linkElement = document.createElement('a');
                linkElement.setAttribute('href', dataUri);
                linkElement.setAttribute('download', `timeline-${new Date().toISOString().split('T')[0]}.csv`);
                linkElement.click();
                
                this.showToast('Timeline exported as CSV!', 'success');
            }

            exportPDF() {
                // Create a printable version
                const printWindow = window.open('', '_blank');
                const sortedEvents = [...this.events].sort((a, b) => new Date(a.date) - new Date(b.date));
                
                const htmlContent = `
                    <!DOCTYPE html>
                    <html>
                    <head>
                        <title>Personal Timeline</title>
                        <style>
                            body { font-family: Arial, sans-serif; margin: 40px; }
                            .header { text-align: center; margin-bottom: 40px; }
                            .event { margin-bottom: 30px; page-break-inside: avoid; }
                            .event-title { font-size: 18px; font-weight: bold; color: #0078d4; }
                            .event-date { color: #666; margin-bottom: 10px; }
                            .event-description { margin-bottom: 10px; }
                            .event-tags { font-style: italic; color: #888; }
                            @media print { body { margin: 20px; } }
                        </style>
                    </head>
                    <body>
                        <div class="header">
                            <h1>Personal Timeline</h1>
                            <p>Generated on ${new Date().toLocaleDateString()}</p>
                        </div>
                        ${sortedEvents.map(event => `
                            <div class="event">
                                <div class="event-title">${event.title}</div>
                                <div class="event-date">${new Date(event.date).toLocaleDateString()}</div>
                                ${event.description ? `<div class="event-description">${event.description}</div>` : ''}
                                ${event.tags && event.tags.length > 0 ? `<div class="event-tags">Tags: ${event.tags.join(', ')}</div>` : ''}
                            </div>
                        `).join('')}
                    </body>
                    </html>
                `;
                
                printWindow.document.write(htmlContent);
                printWindow.document.close();
                printWindow.print();
                
                this.showToast('Timeline prepared for PDF export!', 'success');
            }

            exportImage() {
                // Create a canvas representation of the timeline
                this.showToast('Image export feature coming soon!', 'info');
            }

            importTimeline() {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.json';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            try {
                                const importedEvents = JSON.parse(e.target.result);
                                if (Array.isArray(importedEvents)) {
                                    this.events = importedEvents;
                                    this.saveEvents();
                                    this.renderTimeline();
                                    this.updateStats();
                                    this.showToast('Timeline imported successfully!', 'success');
                                } else {
                                    throw new Error('Invalid format');
                                }
                            } catch (error) {
                                this.showToast('Error importing timeline: Invalid file format', 'error');
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                input.click();
            }
        }

        // Global functions for onclick handlers
        let timelineApp;

        function exportTimeline() {
            timelineApp.showModal('exportModal');
        }

        function importTimeline() {
            timelineApp.importTimeline();
        }

        function showHelp() {
            alert(`Timeline Builder Pro - Keyboard Shortcuts:

• Ctrl/Cmd + N: Focus on new event form
• Ctrl/Cmd + S: Export as JSON
• Escape: Close any open modal
• Drag and drop timeline items to reorder them

Features:
• Add events with rich details and images
• Categorize and tag your events
• Search and filter your timeline
• Export to multiple formats (JSON, CSV, PDF)
• Drag and drop to reorder events
• Responsive design for all devices`);
        }

        function exportJSON() {
            timelineApp.exportJSON();
            timelineApp.closeModal('exportModal');
        }

        function exportPDF() {
            timelineApp.exportPDF();
            timelineApp.closeModal('exportModal');
        }

        function exportImage() {
            timelineApp.exportImage();
            timelineApp.closeModal('exportModal');
        }

        function exportCSV() {
            timelineApp.exportCSV();
            timelineApp.closeModal('exportModal');
        }

        function closeModal(modalId) {
            timelineApp.closeModal(modalId);
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            timelineApp = new TimelineBuilder();
        });
    </script>
</body>
</html>
